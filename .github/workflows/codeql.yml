name: codeql

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Mondays: new queries find things in code that has not changed.
    - cron: "0 7 * * 1"

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          # The extended suite holds the regex-backtracking queries, which matter for text an agent writes.
          queries: security-extended
          # `dist/` is `src/` compiled, so each finding would show twice. Tests hold fake keys on purpose.
          config: |
            paths-ignore:
              - dist
              - test
      - uses: github/codeql-action/analyze@v4
